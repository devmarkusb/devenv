name: preset test matrix

# Windows + MSVC presets must set runner to a Windows hosted runner (e.g. windows-latest). Do not rely on
# runner defaulting to ubuntu-latest while only setting a Windows container image; MSVC setup is gated on runner.

on:
  workflow_call:
    inputs:
      matrix_config:
        description: >-
          JSON array of objects, e.g. {"preset":"ci","runner":"ubuntu-latest"} or {"preset":"ci","image":"..."}.
          Optional per entry: "setup_script" (repo-relative bash script), "setup" (inline shell), "setup_shell" (override shell).
          For Windows/MSVC use "runner":"windows-latest" (MSVC setup uses startsWith(runner, 'windows')).
        type: string
        required: true
      default_setup_script:
        description: >-
          Optional repo-relative setup script when a matrix entry omits setup_script (e.g. .github/ci/preset-setup.sh).
          Runs after checkout inside the job container (if any), before CMake/MSVC setup.
        type: string
        required: false
        default: ''

jobs:
  preset_test_matrix:
    strategy:
      fail-fast: false
      matrix:
        presets: ${{ fromJSON(inputs.matrix_config) }}
    name: "Preset: ${{ matrix.presets.preset }} on ${{ matrix.presets.runner || 'ubuntu-latest' }}"
    runs-on: ${{ matrix.presets.runner || 'ubuntu-latest' }}
    container: ${{ matrix.presets.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
      - name: Consumer setup (script)
        if: matrix.presets.setup_script || inputs.default_setup_script
        shell: bash
        env:
          SETUP_SCRIPT: ${{ matrix.presets.setup_script || inputs.default_setup_script }}
        run: |
          set -euo pipefail
          if [[ ! -f "${SETUP_SCRIPT}" ]]; then
            echo "::error::Setup script not found: ${SETUP_SCRIPT}"
            exit 1
          fi
          bash "${SETUP_SCRIPT}"
      - name: Consumer setup (commands)
        if: matrix.presets.setup
        shell: >-
          ${{ matrix.presets.setup_shell
              || (startsWith(matrix.presets.runner || '', 'windows') && 'pwsh')
              || 'bash' }}
        run: ${{ matrix.presets.setup }}
      - name: Setup build environment
        if: matrix.presets.runner
        uses: lukka/get-cmake@6c740684eca256565af86fb8b8fdf43dd3f6fbc0 # v4.3.0
      - name: Setup MSVC
        if: startsWith(matrix.presets.runner, 'windows')
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Run preset
        run: cmake --workflow --preset ${{ matrix.presets.preset }}
