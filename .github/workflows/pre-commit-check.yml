name: Lint Check (pre-commit)

on: # zizmor: ignore[dangerous-triggers]
  # We have to use pull_request_target here as pull_request does not grant
  # enough permission for reviewdog
  pull_request_target:
  push:
    branches:
      - main

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
