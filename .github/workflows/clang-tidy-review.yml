name: clang-tidy review

on:
  workflow_call:
    inputs:
      clang_image:
        description: >-
          Docker image providing clang-tidy (e.g. ghcr.io/bemanproject/infra-containers-clang:latest).
          Leave empty to run on the native ubuntu-latest runner without a container.
        type: string
        required: false
        default: ''
      use_nix_conan:
        description: >-
          Run clang-tidy inside a Nix shell with optional Conan install instead of using clang_image container mode.
        type: boolean
        required: false
        default: false
      nix_runner:
        description: >-
          Runner label used when use_nix_conan=true (Linux/macOS only; Windows is rejected).
        type: string
        required: false
        default: ubuntu-latest
      nix_path:
        description: NIX_PATH passed to install-nix-action (pin nixpkgs source/channel).
        type: string
        required: false
        default: nixpkgs=channel:nixos-unstable
      nix_packages:
        description: Space-separated nixpkgs package names used for commands (cmake, ninja, conan, clang-tidy, etc.).
        type: string
        required: false
        default: cmake ninja pkg-config conan python3 clang clang-tools
      conan_install:
        description: Run conan install before clang-tidy-review.py.
        type: boolean
        required: false
        default: true
      conanfile:
        description: >-
          Optional explicit Conan file path. If empty, conanfile.py or conanfile.txt at repo root is auto-detected.
        type: string
        required: false
        default: ''
      conan_profile:
        description: Conan profile to use for install (default profile is auto-detected/refreshed).
        type: string
        required: false
        default: default
      conan_install_args:
        description: Extra CLI args appended to conan install (space-separated).
        type: string
        required: false
        default: --build=missing
      conan_output_folder:
        description: Output folder for Conan generator files.
        type: string
        required: false
        default: build/conan
      preset:
        description: 'CMake configure preset passed to clang-tidy-review.py'
        type: string
        default: 'clang-release'
      report_artifact_name:
        description: 'Artifact name for the uploaded full-scan report'
        type: string
        default: 'clang-tidy-full-project-report'
      default_setup_script:
        description: >-
          Optional repo-relative bash script run after checkout before configure.
          devenv/install-boost.sh and devenv/install-qt.sh use cached composite actions;
          other paths are executed with bash.
        type: string
        required: false
        default: ''
      setup_boost:
        description: >-
          Install Boost via devenv/.github/actions/install-boost (cached on Windows/macOS).
        type: boolean
        required: false
        default: false
      boost_components:
        description: Boost components for vcpkg (comma-separated).
        type: string
        required: false
        default: property-tree
      qt_version:
        description: >-
          Pin Qt with install-qt-action (cached). Also used when default_setup_script is
          devenv/install-qt.sh (defaults to 6.9.3).
        type: string
        required: false
        default: ''
      qt_modules:
        description: Extra Qt modules for install-qt-action (comma-separated).
        type: string
        required: false
        default: ''
      qt_install_deps:
        description: >-
          install-deps for install-qt-action (true on ubuntu-latest host; false in Beman containers).
        type: boolean
        required: false
        default: false
      extra_cmake_args:
        description: >-
          Extra cmake --preset argument(s).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  changed-lines-container:
    name: changed lines
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      !inputs.use_nix_conan
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.clang_image }} # zizmor: ignore[unpinned-images]
    steps:
      - &checkout_changed
        name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - &trust_workspace
        name: Trust workspace for git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - &setup_dependencies
        name: Setup dependencies
        if: >-
          inputs.setup_boost ||
          inputs.qt_version != '' ||
          inputs.default_setup_script != ''
        uses: devmarkusb/devenv/.github/actions/setup-dependencies@main
        with:
          setup_boost: ${{ inputs.setup_boost }}
          boost_components: ${{ inputs.boost_components }}
          qt_version: ${{ inputs.qt_version }}
          qt_modules: ${{ inputs.qt_modules }}
          qt_install_deps: ${{ inputs.qt_install_deps }}
          default_setup_script: ${{ inputs.default_setup_script }}

      - &add_matcher
        name: Add clang-tidy problem matcher
        run: echo "::add-matcher::devenv/clang-tidy-problem-matcher.json"

      - name: Run clang-tidy on changed lines
        shell: bash
        env:
          BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
          BASE_SHA_PUSH: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PRESET: ${{ inputs.preset }}
          EXTRA_CMAKE_ARGS: ${{ inputs.extra_cmake_args }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${BASE_SHA_PR}"
          else
            base_sha="${BASE_SHA_PUSH}"
          fi
          BASE_SHA="${base_sha}" \
          HEAD_SHA="${HEAD_SHA}" \
          PRESET="${PRESET}" \
          EXTRA_CMAKE_ARGS="${EXTRA_CMAKE_ARGS}" \
          USE_NIX_CONAN=false \
          ./devenv/run-clang-tidy-workflow.sh changed

  changed-lines-nix:
    name: changed lines (nix+conan)
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'push') &&
      inputs.use_nix_conan
    runs-on: ${{ inputs.nix_runner }}
    steps:
      - *checkout_changed

      - *trust_workspace

      - &validate_nix_runner
        name: Validate runner
        shell: bash
        env:
          RUNNER_NAME: ${{ inputs.nix_runner }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_NAME}" == windows* ]]; then
            echo "::error::clang-tidy-review.yml with use_nix_conan=true does not support Windows runners."
            exit 1
          fi

      - *setup_dependencies

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: ${{ inputs.nix_path }}

      - *add_matcher

      - name: Run clang-tidy on changed lines (nix + conan)
        shell: bash
        env:
          BASE_SHA_PR: ${{ github.event.pull_request.base.sha }}
          BASE_SHA_PUSH: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PRESET: ${{ inputs.preset }}
          EXTRA_CMAKE_ARGS: ${{ inputs.extra_cmake_args }}
          NIX_PACKAGES: ${{ inputs.nix_packages }}
          CONAN_INSTALL_ENABLED: ${{ toJSON(inputs.conan_install) }}
          CONANFILE_INPUT: ${{ inputs.conanfile }}
          CONAN_PROFILE: ${{ inputs.conan_profile }}
          CONAN_INSTALL_ARGS: ${{ inputs.conan_install_args }}
          CONAN_OUTPUT_FOLDER: ${{ inputs.conan_output_folder }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${BASE_SHA_PR}"
          else
            base_sha="${BASE_SHA_PUSH}"
          fi
          BASE_SHA="${base_sha}" \
          HEAD_SHA="${HEAD_SHA}" \
          PRESET="${PRESET}" \
          EXTRA_CMAKE_ARGS="${EXTRA_CMAKE_ARGS}" \
          USE_NIX_CONAN=true \
          NIX_PACKAGES="${NIX_PACKAGES}" \
          CONAN_INSTALL_ENABLED="${CONAN_INSTALL_ENABLED}" \
          CONANFILE_INPUT="${CONANFILE_INPUT}" \
          CONAN_PROFILE="${CONAN_PROFILE}" \
          CONAN_INSTALL_ARGS="${CONAN_INSTALL_ARGS}" \
          CONAN_OUTPUT_FOLDER="${CONAN_OUTPUT_FOLDER}" \
          ./devenv/run-clang-tidy-workflow.sh changed

  full-project-container:
    name: full project
    if: >-
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main') &&
      !inputs.use_nix_conan
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.clang_image }} # zizmor: ignore[unpinned-images]
    steps:
      - &checkout_full
        name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - *trust_workspace

      - *setup_dependencies

      - *add_matcher

      - name: Run clang-tidy on the full codebase
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
          EXTRA_CMAKE_ARGS: ${{ inputs.extra_cmake_args }}
        run: |
          set -euo pipefail

          report_dir="${RUNNER_TEMP}/clang-tidy"
          report_file="${report_dir}/full-project.txt"
          mkdir -p "${report_dir}"
          PRESET="${PRESET}" \
          EXTRA_CMAKE_ARGS="${EXTRA_CMAKE_ARGS}" \
          REPORT_FILE="${report_file}" \
          USE_NIX_CONAN=false \
          ./devenv/run-clang-tidy-workflow.sh full

      - name: Upload full scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.report_artifact_name }}
          path: ${{ runner.temp }}/clang-tidy/full-project.txt
          if-no-files-found: ignore

  full-project-nix:
    name: full project (nix+conan)
    if: >-
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main') &&
      inputs.use_nix_conan
    runs-on: ${{ inputs.nix_runner }}
    steps:
      - *checkout_full

      - *trust_workspace

      - *validate_nix_runner

      - *setup_dependencies

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: ${{ inputs.nix_path }}

      - *add_matcher

      - name: Run clang-tidy on the full codebase (nix + conan)
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
          EXTRA_CMAKE_ARGS: ${{ inputs.extra_cmake_args }}
          NIX_PACKAGES: ${{ inputs.nix_packages }}
          CONAN_INSTALL_ENABLED: ${{ toJSON(inputs.conan_install) }}
          CONANFILE_INPUT: ${{ inputs.conanfile }}
          CONAN_PROFILE: ${{ inputs.conan_profile }}
          CONAN_INSTALL_ARGS: ${{ inputs.conan_install_args }}
          CONAN_OUTPUT_FOLDER: ${{ inputs.conan_output_folder }}
        run: |
          set -euo pipefail

          report_dir="${RUNNER_TEMP}/clang-tidy"
          report_file="${report_dir}/full-project.txt"
          mkdir -p "${report_dir}"
          PRESET="${PRESET}" \
          EXTRA_CMAKE_ARGS="${EXTRA_CMAKE_ARGS}" \
          REPORT_FILE="${report_file}" \
          USE_NIX_CONAN=true \
          NIX_PACKAGES="${NIX_PACKAGES}" \
          CONAN_INSTALL_ENABLED="${CONAN_INSTALL_ENABLED}" \
          CONANFILE_INPUT="${CONANFILE_INPUT}" \
          CONAN_PROFILE="${CONAN_PROFILE}" \
          CONAN_INSTALL_ARGS="${CONAN_INSTALL_ARGS}" \
          CONAN_OUTPUT_FOLDER="${CONAN_OUTPUT_FOLDER}" \
          ./devenv/run-clang-tidy-workflow.sh full

      - name: Upload full scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.report_artifact_name }}
          path: ${{ runner.temp }}/clang-tidy/full-project.txt
          if-no-files-found: ignore
