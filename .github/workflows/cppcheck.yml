name: cppcheck

on:
  workflow_call:
    inputs:
      preset:
        description: 'CMake configure preset (must produce compile_commands.json)'
        type: string
        default: 'clang-release'
      default_setup_script:
        description: >-
          Optional repo-relative bash script run after checkout before configure
          (e.g. devenv/install-boost.sh when find_package(Boost) is required).
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  full-project:
    name: full project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Consumer setup (script)
        if: inputs.default_setup_script != ''
        shell: bash
        env:
          SETUP_SCRIPT: ${{ inputs.default_setup_script }}
        run: |
          set -euo pipefail
          if [[ ! -f "${SETUP_SCRIPT}" ]]; then
            echo "::error::Setup script not found: ${SETUP_SCRIPT}"
            exit 1
          fi
          bash "${SETUP_SCRIPT}"

      - name: Run cppcheck
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
        run: ./devenv/run-cppcheck.sh "${PRESET}"
