# zizmor (https://docs.zizmor.sh/configuration/) — used by CI and pre-commit.
# Reusable workflows here intentionally use version tags on many actions; consumers may pin to SHAs.
rules:
  unpinned-uses:
    disable: true
  unpinned-images:
    # Reusable workflows accept the container image as a caller-supplied input; the caller pins it.
    disable: true
  dangerous-triggers:
    # pull_request_target is intentional in pre-commit-check.yml: reviewdog needs write permissions
    # to post PR review suggestions, which pull_request does not grant. The workflow mitigates risk
    # by only running pre-commit hooks (pinned by revision) on checked-out PR code.
    ignore:
      - .github/workflows/pre-commit-check.yml
